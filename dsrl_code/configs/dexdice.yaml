method: DexDICE
env_id: SafetyCarCircle-v0

cid: 0
pid: 0

use_wandb: False
wandb:
  project: null
  entity: null

dataset:
  dataset_path: ./dataset/SafetyCarCircle-v0
  expert:
    types: ['dsrl-performance-v0']
    start_indices: [0]
    num_trajs:     [-1]
  safe:
    types: ['dsrl-safe-v0']
    start_indices: [0]
    num_trajs:     [-1]
  mixed:
    types: ['dsrl-shuffled-v0']
    start_indices: [0]
    num_trajs:     [-1]

replay_buffer:
  class: 'MDPReplayBuffer'
  max_replay_buffer_size: 10000000
  standardize_obs: False
  standardize_act: False
  use_absorbing_state: True

policy:
  class: 'GaussianPolicy'
  layer_sizes: [256, 256]

train:
  seed: 0
  gamma: 0.99
  alpha: 0.0        # DICE regularization coefficient: 0.0 for DexDICE; 0.1 for DemoDICE-S/-U and 7.5 for DWBC-S (Table J)
  lr: 3e-5
  lr_nu: 3e-5
  lr_disc: 3e-5
  lr_lambda: 3e-4 
  nu_hidden_size: [256, 256]
  nu_gp_weight: 10.0
  disc_hidden_size: [256, 256]
  disc_gp_weight: 10.0 
  disc_steps: 1
  uc_disc_hidden_size: [256, 256]
  uc_disc_gp_weight: 0.0
  total_iteration: 1000000
  eval_freq: 10000
  batch_size: 512
  save_policy_path: null
  num_evals: 50
  disc_quantile: 0.01          # target FNR kappa of the safe-support estimator
  disc_learning_during_train: True   # FBC / JFBC: keep training the discriminators during BC updates
  cost_threshold: 40.0         # overridden per task from configs/dsrl_task_info.yaml when the task is listed
  threshold_update_freq: 100
  lambda_starts: 1.0
  pretrain_steps: 0
  prior_learning_during_train: True

  
